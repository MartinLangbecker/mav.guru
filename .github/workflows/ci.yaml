name: CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
        env:
          CI: true

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch commit hash
        id: hash
        run: echo "hash=$(echo $GITHUB_SHA | head -c7)" >> "$GITHUB_OUTPUT"
      - name: Fetch current date and time
        id: datetime
        run: echo "datetime=$(date -u +'%Y-%m-%dT%H.%M.%SZ')" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/${{github.repository}}:v1_${{steps.hash.outputs.hash}}_${{steps.datetime.outputs.datetime}}
          cache-from: type=gha
          cache-to: type=gha,mode=max
